{{- /* Project override of the theme partial, for two reasons:

       1. The bootstrap is not an inline <script>. It is compiled from
          assets/js/matomo.js, fingerprinted and SRI-guarded, which is what lets
          head/csp.html ship `script-src 'self'` without 'unsafe-inline'.

       2. No <img> tracking beacon. The theme emits one as a no-JS fallback, and
          plain HTML cannot honour Do Not Track, an opt-out, or a consent decision
          taken later — there is no hook to hang one on, and it sends its hit even
          on a browser the JavaScript tracker correctly stays silent for. It also
          closes <head>, per the HTML parsing spec, making the order of everything
          after it load-bearing.

          The cost is that visitors without JavaScript go uncounted, which is the
          right trade: a hit nothing can suppress is worse than a missing hit. */ -}}
{{- with site.Params.Services.MatomoAnalytics }}
{{- if hugo.IsProduction }}
<!-- Matomo -->
{{ $js := resources.Get "js/matomo.js" | resources.ExecuteAsTemplate "js/matomo.js" . | resources.Minify | fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
<!-- End Matomo -->
{{- end }}
{{- end -}}
